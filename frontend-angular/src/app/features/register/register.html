<div class="min-h-screen flex items-center justify-center p-6">
  <div class="max-w-sm w-full space-y-6 animate-rise">
    <div class="text-center">
      <div class="inline-flex items-center gap-2.5 mb-2">
        <span class="grid place-items-center w-12 h-12 rounded-2xl btn-brand text-2xl shadow-lg">🍔</span>
        <div class="text-left">
          <h1 class="text-2xl font-bold tracking-tight brand-text leading-none">Bueno's House</h1>
          <p class="text-[11px] uppercase tracking-[0.2em] text-neutral-500 mt-1">Criar conta de cliente</p>
        </div>
      </div>
    </div>

    <form (ngSubmit)="submit()" class="glass rounded-2xl p-8 space-y-4">
      <div class="space-y-1.5">
        <label class="text-sm text-neutral-300">Nome completo</label>
        <input
          type="text"
          name="fullName"
          [(ngModel)]="fullName"
          required
          autocomplete="name"
          class="w-full rounded-xl bg-black/30 border border-white/10 px-3.5 py-2.5 text-sm outline-none focus:border-brand-500/60 focus:bg-black/40 transition"
        />
      </div>

      <div class="space-y-1.5">
        <label class="text-sm text-neutral-300">E-mail</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          autocomplete="username"
          class="w-full rounded-xl bg-black/30 border border-white/10 px-3.5 py-2.5 text-sm outline-none focus:border-brand-500/60 focus:bg-black/40 transition"
        />
      </div>

      <div class="space-y-1.5">
        <label class="text-sm text-neutral-300">Telefone</label>
        <input
          type="tel"
          name="phone"
          [(ngModel)]="phone"
          required
          autocomplete="tel"
          placeholder="11999998888"
          class="w-full rounded-xl bg-black/30 border border-white/10 px-3.5 py-2.5 text-sm outline-none focus:border-brand-500/60 focus:bg-black/40 transition"
        />
      </div>

      <div class="space-y-1.5">
        <label class="text-sm text-neutral-300">Senha</label>
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          minlength="6"
          autocomplete="new-password"
          class="w-full rounded-xl bg-black/30 border border-white/10 px-3.5 py-2.5 text-sm outline-none focus:border-brand-500/60 focus:bg-black/40 transition"
        />
      </div>

      @if (error()) {
        <div class="rounded-xl bg-red-950/70 border border-red-800/60 p-3 text-sm text-red-300">
          {{ error() }}
        </div>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full btn-brand rounded-xl py-2.5 text-sm"
      >
        {{ loading() ? 'Criando conta...' : 'Criar conta' }}
      </button>
    </form>

    <p class="text-center text-sm text-neutral-400">
      Já tem conta?
      <a routerLink="/login" class="text-brand-400 hover:underline">Entrar</a>
    </p>
  </div>
</div>
