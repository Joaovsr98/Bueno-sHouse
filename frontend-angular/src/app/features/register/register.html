<div class="min-h-screen flex items-center justify-center p-6">
  <div class="max-w-md w-full space-y-6 reveal">
    <div class="flex flex-col items-center text-center gap-5">
      <a routerLink="/app/cardapio"><app-logo [size]="48" /></a>
      <div>
        <p class="eyebrow">Nova conta</p>
        <h1 class="mt-3 text-3xl font-bold">Peça em <span class="text-ember">poucos cliques</span></h1>
      </div>
    </div>

    <form (ngSubmit)="submit()" class="glass rounded-2xl p-8 space-y-4">
      <div class="space-y-1.5">
        <label class="text-sm text-neutral-300">Nome completo</label>
        <input
          type="text"
          name="fullName"
          [(ngModel)]="fullName"
          required
          autocomplete="name"
          class="w-full rounded-xl bg-black/30 border border-white/10 px-3.5 py-2.5 text-sm outline-none focus:border-brand-500/60 focus:bg-black/40 transition"
        />
      </div>

      <div class="space-y-1.5">
        <label class="text-sm text-neutral-300">E-mail</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          autocomplete="username"
          class="w-full rounded-xl bg-black/30 border border-white/10 px-3.5 py-2.5 text-sm outline-none focus:border-brand-500/60 focus:bg-black/40 transition"
        />
      </div>

      <div class="space-y-1.5">
        <label class="text-sm text-neutral-300">Telefone</label>
        <input
          type="tel"
          name="phone"
          [(ngModel)]="phone"
          required
          autocomplete="tel"
          placeholder="11999998888"
          class="w-full rounded-xl bg-black/30 border border-white/10 px-3.5 py-2.5 text-sm outline-none focus:border-brand-500/60 focus:bg-black/40 transition"
        />
      </div>

      <div class="space-y-1.5">
        <label class="text-sm text-neutral-300">Senha</label>
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          minlength="6"
          autocomplete="new-password"
          class="w-full rounded-xl bg-black/30 border border-white/10 px-3.5 py-2.5 text-sm outline-none focus:border-brand-500/60 focus:bg-black/40 transition"
        />
      </div>

      <div class="pt-2 border-t border-white/10 space-y-2">
        <p class="text-sm text-neutral-300">Endereço de entrega</p>
        <div class="grid grid-cols-3 gap-2 text-sm">
          <input name="street" [(ngModel)]="addr.street" required placeholder="Rua" autocomplete="address-line1"
            class="col-span-2 rounded-xl bg-black/30 border border-white/10 px-3 py-2 outline-none focus:border-brand-500/60" />
          <input name="number" [(ngModel)]="addr.number" required placeholder="Nº"
            class="rounded-xl bg-black/30 border border-white/10 px-3 py-2 outline-none focus:border-brand-500/60" />
          <input name="complement" [(ngModel)]="addr.complement" placeholder="Complemento (opcional)" autocomplete="address-line2"
            class="col-span-3 rounded-xl bg-black/30 border border-white/10 px-3 py-2 outline-none focus:border-brand-500/60" />
          <select name="neighborhood" [(ngModel)]="addr.neighborhood" required
            class="col-span-3 rounded-xl bg-ink-850 border border-white/10 px-3 py-2 outline-none focus:border-brand-500/60">
            <option value="" disabled>Bairro (só atendemos estes)</option>
            @for (z of zones(); track z.id) {
              <option [value]="z.neighborhood">{{ z.neighborhood }} — entrega {{ currency(z.fee) }}</option>
            }
          </select>
          <input name="city" [(ngModel)]="addr.city" required placeholder="Cidade" autocomplete="address-level2"
            class="col-span-2 rounded-xl bg-black/30 border border-white/10 px-3 py-2 outline-none focus:border-brand-500/60" />
          <input name="state" [(ngModel)]="addr.state" required placeholder="UF" maxlength="2" autocomplete="address-level1"
            class="rounded-xl bg-black/30 border border-white/10 px-3 py-2 outline-none focus:border-brand-500/60 uppercase" />
          <input name="zipCode" [(ngModel)]="addr.zipCode" required placeholder="CEP" autocomplete="postal-code"
            class="col-span-3 rounded-xl bg-black/30 border border-white/10 px-3 py-2 outline-none focus:border-brand-500/60" />
        </div>
      </div>

      @if (error()) {
        <div class="rounded-xl bg-red-950/70 border border-red-800/60 p-3 text-sm text-red-300">
          {{ error() }}
        </div>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full btn-brand rounded-xl py-2.5 text-sm"
      >
        {{ loading() ? 'Criando conta...' : 'Criar conta' }}
      </button>
    </form>

    <p class="text-center text-sm text-neutral-400">
      Já tem conta?
      <a routerLink="/login" [queryParams]="returnUrl ? { returnUrl: returnUrl } : {}" class="text-brand-400 hover:underline">Entrar</a>
    </p>
  </div>
</div>
