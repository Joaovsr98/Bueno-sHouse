<div class="min-h-screen bg-neutral-950 text-neutral-100 flex">
  <aside class="w-56 shrink-0 border-r border-neutral-800 flex flex-col">
    <div class="p-4 border-b border-neutral-800">
      <p class="text-sm font-semibold">Sistema Restaurante</p>
      <p class="text-xs text-neutral-500 mt-0.5">{{ user()?.profileName }}</p>
    </div>

    <nav class="flex-1 p-2 space-y-1">
      @for (item of navItems; track item.to) {
        <a
          [routerLink]="item.to"
          routerLinkActive="bg-neutral-800 text-neutral-100"
          [routerLinkActiveOptions]="{ exact: false }"
          class="block rounded-lg px-3 py-2 text-sm text-neutral-400 hover:bg-neutral-900 hover:text-neutral-200"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="p-3 border-t border-neutral-800 space-y-2">
      @if (units().length > 0) {
        <select
          [value]="unitId() ?? ''"
          (change)="onUnitChange($any($event.target).value)"
          class="w-full rounded-lg bg-neutral-900 border border-neutral-700 px-2 py-1.5 text-xs text-neutral-300"
        >
          @for (u of units(); track u.id) {
            <option [value]="u.id">{{ u.name }}</option>
          }
        </select>
      }
      <button
        (click)="logout()"
        class="w-full text-left text-xs text-neutral-500 hover:text-neutral-300 px-1"
      >
        Sair
      </button>
    </div>
  </aside>

  <main class="flex-1 min-w-0">
    <router-outlet />
  </main>
</div>
