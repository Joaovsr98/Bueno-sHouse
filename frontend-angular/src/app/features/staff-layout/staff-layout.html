<div class="min-h-screen flex">
  <aside class="w-60 shrink-0 border-r border-white/10 flex flex-col bg-black/20 backdrop-blur-xl">
    <div class="p-4 border-b border-white/10">
      <div class="flex items-center gap-2.5">
        <span class="grid place-items-center w-9 h-9 rounded-xl btn-brand text-lg">🍔</span>
        <div>
          <p class="text-base font-bold brand-text leading-none">Bueno's House</p>
          <p class="text-[10px] uppercase tracking-[0.18em] text-neutral-500 mt-1">{{ user()?.profileName }}</p>
        </div>
      </div>
    </div>

    <nav class="flex-1 p-2 space-y-1">
      @for (item of navItems; track item.to) {
        <a
          [routerLink]="item.to"
          routerLinkActive="!bg-brand-500/15 !text-brand-300 !border-brand-500/30 is-active"
          [routerLinkActiveOptions]="{ exact: false }"
          class="group relative flex items-center gap-2.5 rounded-xl px-3 py-2 text-sm text-neutral-400 border border-transparent hover:bg-white/5 hover:text-neutral-200 transition"
        >
          <span
            class="absolute left-0 top-1/2 -translate-y-1/2 h-0 w-0.5 rounded-full bg-brand-400 transition-all duration-200 group-[.is-active]:h-5"
          ></span>
          <span class="text-base leading-none opacity-90">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="p-3 border-t border-white/10 space-y-2">
      @if (units().length > 0) {
        <label class="text-[10px] uppercase tracking-wider text-neutral-600 px-1">Unidade</label>
        <select
          [value]="unitId() ?? ''"
          (change)="onUnitChange($any($event.target).value)"
          class="w-full rounded-xl bg-black/30 border border-white/10 px-2 py-1.5 text-xs text-neutral-300 outline-none focus:border-brand-500/60"
        >
          @for (u of units(); track u.id) {
            <option [value]="u.id">{{ u.name }}</option>
          }
        </select>
      }
      <div class="flex items-center gap-2 pt-1">
        <span class="grid place-items-center w-8 h-8 rounded-full bg-white/5 border border-white/10 text-xs font-semibold text-brand-300">
          {{ (user()?.profileName || '?').charAt(0) }}
        </span>
        <div class="flex-1 min-w-0">
          <p class="text-xs text-neutral-300 truncate">{{ user()?.email }}</p>
        </div>
        <button
          (click)="logout()"
          title="Sair"
          class="text-neutral-500 hover:text-red-400 transition text-sm px-1.5 py-1 rounded-lg hover:bg-white/5"
        >
          ⎋
        </button>
      </div>
    </div>
  </aside>

  <main class="flex-1 min-w-0">
    <router-outlet />
  </main>
</div>
