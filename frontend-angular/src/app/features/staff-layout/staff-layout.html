<div class="min-h-screen lg:flex">
  <!-- Barra superior no celular/tablet -->
  <header class="lg:hidden sticky top-0 z-30 flex items-center justify-between px-4 h-16 border-b border-white/10 bg-ink-950/80 backdrop-blur-xl">
    <app-logo [size]="34" tagline="" />
    <button (click)="menuOpen.set(!menuOpen())" class="p-2 rounded-lg text-neutral-300 hover:bg-white/5" [attr.aria-expanded]="menuOpen()" aria-label="Abrir menu">
      <app-icon [name]="menuOpen() ? 'close' : 'menu'" [size]="22" />
    </button>
  </header>

  @if (menuOpen()) {
    <div class="lg:hidden fixed inset-0 z-30 bg-black/60" (click)="menuOpen.set(false)"></div>
  }

  <aside
    class="fixed lg:sticky top-0 z-40 h-screen w-64 shrink-0 border-r border-white/10 flex flex-col bg-ink-950/95 lg:bg-black/20 backdrop-blur-xl transition-transform duration-300 lg:translate-x-0"
    [class.-translate-x-full]="!menuOpen()"
  >
    <div class="px-5 py-5 border-b border-white/10">
      <app-logo [size]="40" [tagline]="profileLabels[user()?.profileName ?? ''] || 'Cozinha e gestão'" />
    </div>

    <p class="eyebrow-plain text-[0.6rem] px-6 pt-5 pb-2">Operação</p>
    <nav class="flex-1 px-3 space-y-0.5 overflow-y-auto">
      @for (item of navItems(); track item.to) {
        <a
          [routerLink]="item.to"
          (click)="menuOpen.set(false)"
          routerLinkActive="is-active !bg-brand-500/10 !text-white"
          [routerLinkActiveOptions]="{ exact: false }"
          class="group relative flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-neutral-400 hover:bg-white/[0.04] hover:text-neutral-100 transition"
        >
          <span class="absolute -left-3 top-1/2 -translate-y-1/2 h-0 w-[3px] rounded-full bg-gradient-to-b from-brand-500 to-gold-400 transition-all duration-200 group-[.is-active]:h-6"></span>
          <span class="text-neutral-500 group-hover:text-brand-400 group-[.is-active]:text-brand-400 transition">
            <app-icon [name]="item.icon" [size]="18" />
          </span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="p-4 border-t border-white/10 space-y-3">
      @if (units().length > 0) {
        <div>
          <label class="field-label">Unidade</label>
          <select
            [value]="unitId() ?? ''"
            (change)="onUnitChange($any($event.target).value)"
            class="field text-xs py-2"
          >
            @for (u of units(); track u.id) {
              <option [value]="u.id">{{ u.name }}</option>
            }
          </select>
        </div>
      }
      <div class="flex items-center gap-3">
        <span class="grid place-items-center w-9 h-9 rounded-full bg-gradient-to-br from-brand-500 to-gold-400 text-ink-950 text-sm font-bold font-display">
          {{ (user()?.email || '?').charAt(0).toUpperCase() }}
        </span>
        <div class="flex-1 min-w-0">
          <p class="text-xs text-neutral-200 truncate">{{ user()?.email }}</p>
          <p class="eyebrow-plain text-[0.55rem] mt-0.5">{{ profileLabels[user()?.profileName ?? ''] || user()?.profileName }}</p>
        </div>
        <button (click)="logout()" title="Sair" aria-label="Sair" class="p-2 rounded-lg text-neutral-500 hover:text-red-400 hover:bg-white/5 transition">
          <app-icon name="logout" [size]="18" />
        </button>
      </div>
    </div>
  </aside>

  <main class="flex-1 min-w-0">
    <router-outlet />
  </main>
</div>
