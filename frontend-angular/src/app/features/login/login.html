<div class="min-h-screen flex items-center justify-center p-6">
  <div class="max-w-sm w-full space-y-6">
    <div class="text-center">
      <div class="inline-flex items-center gap-2.5 mb-2">
        <span class="grid place-items-center w-11 h-11 rounded-2xl btn-brand text-xl">🍔</span>
        <div class="text-left">
          <h1 class="text-2xl font-bold tracking-tight brand-text leading-none">Bueno's House</h1>
          <p class="text-[11px] uppercase tracking-[0.2em] text-neutral-500 mt-1">Gestão do restaurante</p>
        </div>
      </div>
    </div>

    <div class="glass rounded-2xl p-5 space-y-3">
      <p class="text-xs text-neutral-400">Acesso rápido (ambiente de demonstração)</p>
      <div class="grid grid-cols-2 gap-2">
        @for (p of quickAccess; track p.email) {
          <button
            type="button"
            [disabled]="loading()"
            (click)="quickLogin(p.email)"
            class="glass glass-hover rounded-xl py-2.5 text-sm text-neutral-200 transition disabled:opacity-50"
          >
            {{ p.label }}
          </button>
        }
      </div>
    </div>

    <div class="flex items-center gap-3 text-xs text-neutral-600">
      <div class="flex-1 h-px bg-white/10"></div>
      ou entre manualmente
      <div class="flex-1 h-px bg-white/10"></div>
    </div>

    <form (ngSubmit)="submit()" class="glass rounded-2xl p-8 space-y-4">
      <div class="space-y-1">
        <label class="text-sm text-neutral-300">E-mail</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          class="w-full rounded-xl bg-black/30 border border-white/10 px-3 py-2 text-sm outline-none focus:border-brand-500/60 transition"
        />
      </div>

      <div class="space-y-1">
        <label class="text-sm text-neutral-300">Senha</label>
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          class="w-full rounded-xl bg-black/30 border border-white/10 px-3 py-2 text-sm outline-none focus:border-brand-500/60 transition"
        />
      </div>

      @if (error()) {
        <div class="rounded-xl bg-red-950/70 border border-red-800/60 p-3 text-sm text-red-300">
          {{ error() }}
        </div>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full btn-brand rounded-xl py-2.5 text-sm"
      >
        {{ loading() ? 'Entrando...' : 'Entrar' }}
      </button>

      <p class="text-xs text-neutral-600 text-center">
        admin&#64;demo.local / admin123
      </p>
    </form>
  </div>
</div>
