<div class="min-h-screen bg-neutral-950 text-neutral-100 flex items-center justify-center p-6">
  <div class="max-w-sm w-full space-y-6">
    <div>
      <h1 class="text-xl font-semibold mb-1">Entrar</h1>
      <p class="text-sm text-neutral-400">Sistema de Gestão para Restaurante</p>
    </div>

    <div class="rounded-xl border border-neutral-800 bg-neutral-900 p-5 space-y-3">
      <p class="text-xs text-neutral-400">Acesso rápido (ambiente de demonstração)</p>
      <div class="grid grid-cols-2 gap-2">
        @for (p of quickAccess; track p.email) {
          <button
            type="button"
            [disabled]="loading()"
            (click)="quickLogin(p.email)"
            class="rounded-lg bg-neutral-800 border border-neutral-700 py-2 text-sm hover:bg-neutral-700 disabled:opacity-50"
          >
            {{ p.label }}
          </button>
        }
      </div>
    </div>

    <div class="flex items-center gap-3 text-xs text-neutral-600">
      <div class="flex-1 h-px bg-neutral-800"></div>
      ou entre manualmente
      <div class="flex-1 h-px bg-neutral-800"></div>
    </div>

    <form
      (ngSubmit)="submit()"
      class="rounded-xl border border-neutral-800 bg-neutral-900 p-8 space-y-4"
    >
      <div class="space-y-1">
        <label class="text-sm text-neutral-300">E-mail</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          class="w-full rounded-lg bg-neutral-800 border border-neutral-700 px-3 py-2 text-sm outline-none focus:border-neutral-500"
        />
      </div>

      <div class="space-y-1">
        <label class="text-sm text-neutral-300">Senha</label>
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          class="w-full rounded-lg bg-neutral-800 border border-neutral-700 px-3 py-2 text-sm outline-none focus:border-neutral-500"
        />
      </div>

      @if (error()) {
        <div class="rounded-lg bg-red-950 border border-red-800 p-3 text-sm text-red-300">
          {{ error() }}
        </div>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full rounded-lg bg-neutral-100 text-neutral-900 font-medium py-2 text-sm disabled:opacity-50"
      >
        {{ loading() ? 'Entrando...' : 'Entrar' }}
      </button>

      <p class="text-xs text-neutral-500">
        Ambiente de desenvolvimento: admin&#64;demo.local / admin123
      </p>
    </form>
  </div>
</div>
