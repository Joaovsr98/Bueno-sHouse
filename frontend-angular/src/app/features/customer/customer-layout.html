<div class="min-h-screen">
  <header class="sticky top-0 z-10 border-b border-white/10 bg-black/40 backdrop-blur-xl">
    <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
      <a routerLink="/app/cardapio" class="flex items-center gap-2.5">
        <span class="grid place-items-center w-9 h-9 rounded-xl btn-brand text-lg">🍔</span>
        <span class="text-lg font-bold brand-text">Bueno's House</span>
      </a>

      <nav class="flex items-center gap-1">
        <a
          routerLink="/app/cardapio"
          routerLinkActive="!text-brand-300"
          class="px-3 py-2 rounded-xl text-sm text-neutral-400 hover:text-neutral-200 transition"
        >
          Cardápio
        </a>
        <a
          routerLink="/app/pedidos"
          routerLinkActive="!text-brand-300"
          class="px-3 py-2 rounded-xl text-sm text-neutral-400 hover:text-neutral-200 transition"
        >
          Meus pedidos
        </a>
        <a
          routerLink="/app/carrinho"
          routerLinkActive="!text-brand-300"
          class="relative px-3 py-2 rounded-xl text-sm text-neutral-400 hover:text-neutral-200 transition"
        >
          Carrinho
          @if (cartCount() > 0) {
            <span class="absolute -top-0.5 -right-0.5 grid place-items-center min-w-5 h-5 px-1 rounded-full btn-brand text-[11px] font-bold">
              {{ cartCount() }}
            </span>
          }
        </a>
        <button (click)="logout()" class="ml-1 px-3 py-2 text-sm text-neutral-500 hover:text-neutral-300 transition">
          Sair
        </button>
      </nav>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-6">
    <router-outlet />
  </main>
</div>
