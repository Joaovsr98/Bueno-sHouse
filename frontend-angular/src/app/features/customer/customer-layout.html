<div class="relative min-h-screen flex flex-col">
  <!-- Foto de fundo da area do cliente: abre o apetite sem atrapalhar a leitura. -->
  <div class="food-bg" aria-hidden="true"></div>
  <header class="sticky top-0 z-20 border-b border-white/10 bg-ink-950/75 backdrop-blur-xl">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
      <a routerLink="/app/cardapio" aria-label="Bueno's House - cardápio">
        <app-logo [size]="36" tagline="" />
      </a>

      <nav class="flex items-center gap-1 text-sm">
        <a routerLink="/app/cardapio" routerLinkActive="!text-white !bg-white/[0.06]"
          class="hidden sm:inline-flex px-3 py-2 rounded-xl text-neutral-400 hover:text-neutral-100 transition">Cardápio</a>
        @if (isLoggedIn()) {
          <a routerLink="/app/pedidos" routerLinkActive="!text-white !bg-white/[0.06]"
            class="px-3 py-2 rounded-xl text-neutral-400 hover:text-neutral-100 transition">Meus pedidos</a>
        }
        <a routerLink="/app/carrinho" routerLinkActive="!text-white !bg-white/[0.06]"
          class="relative inline-flex items-center gap-2 px-3 py-2 rounded-xl text-neutral-400 hover:text-neutral-100 transition"
          aria-label="Carrinho">
          <app-icon name="cart" [size]="18" />
          <span class="hidden sm:inline">Carrinho</span>
          @if (cartCount() > 0) {
            <span style="position: absolute" class="-top-1 -right-1 grid place-items-center min-w-5 h-5 px-1 rounded-full btn-brand text-[11px] font-bold">
              {{ cartCount() }}
            </span>
          }
        </a>
        @if (isLoggedIn()) {
          <button (click)="logout()" class="p-2 rounded-xl text-neutral-500 hover:text-red-400 hover:bg-white/5 transition" title="Sair" aria-label="Sair">
            <app-icon name="logout" [size]="18" />
          </button>
        } @else {
          <a routerLink="/login" [queryParams]="{ lado: 'cliente', returnUrl: '/app/cardapio' }" class="ml-1 btn-brand rounded-xl px-4 py-2 text-sm">Entrar</a>
        }
      </nav>
    </div>
  </header>

  <main class="relative flex-1 w-full max-w-5xl mx-auto px-4 py-8">
    <router-outlet />
  </main>

  <footer class="relative border-t border-white/10 bg-ink-950/80">
    <div class="max-w-5xl mx-auto px-4 py-6 flex flex-wrap items-center justify-between gap-3">
      <app-logo [size]="28" tagline="" />
      <p class="eyebrow-plain text-[0.6rem]">Feito na brasa, {{ year }}</p>
    </div>
  </footer>
</div>
