<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Bueno's House | Cozinha e gestão</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bueno's House: cardápio digital, pedidos, cozinha, estoque e ficha técnica em um só lugar.">
  <meta name="theme-color" content="#07080c">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
</head>
<body>
  <!-- Enquanto o app baixa, as bocas acendem (o Angular troca este conteudo ao iniciar). -->
  <style>
    .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #07080c; }
    .boot-row { display: flex; gap: 14px; }
    .boot-row span { width: 20px; height: 20px; border-radius: 999px; border: 2px solid rgba(255,255,255,.14);
      background: #11141c; animation: boot-light 1.32s ease-in-out infinite; }
    .boot-row span:nth-child(2) { animation-delay: .22s; }
    .boot-row span:nth-child(3) { animation-delay: .44s; }
    .boot p { margin: 22px 0 0; font: 500 11px 'IBM Plex Mono', monospace; letter-spacing: .3em;
      text-transform: uppercase; color: #8a8f9c; text-align: center; }
    @keyframes boot-light {
      0%, 100% { background: #11141c; border-color: rgba(255,255,255,.14); box-shadow: none; }
      35%, 55% { border-color: #ff8c3a; box-shadow: 0 0 16px 3px rgba(255,106,26,.55);
        background: radial-gradient(circle at 50% 60%, #f5b544, #ff6a1a 55%, #e8500c); }
    }
  </style>
  <app-root>
    <div class="boot" role="status" aria-label="Carregando">
      <div><div class="boot-row"><span></span><span></span><span></span></div><p>Esquentando a chapa</p></div>
    </div>
  </app-root>
</body>
</html>
