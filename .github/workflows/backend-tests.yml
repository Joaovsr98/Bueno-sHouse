name: Backend · testes de integração

# Roda a suíte completa (Testcontainers sobe um MySQL 8 real) a cada push e pull request
# que mexa no backend. O build da imagem do Render pula os testes; este job é quem garante
# que migrations, mapeamentos (ddl-auto=validate) e regras de negócio continuam corretos.
on:
  push:
    branches: [main, feat/migracao-angular]
    paths: ['backend/**', '.github/workflows/backend-tests.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-tests.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Testes (unitários + integração)
        run: mvn -B verify -DtrimStackTrace=false

      # Resume as falhas como anotacoes (aparecem no resumo do job, sem abrir o log inteiro).
      - name: Resumo das falhas
        if: failure()
        run: |
          shopt -s nullglob
          for f in target/surefire-reports/*.txt target/failsafe-reports/*.txt; do
            if grep -qE "FAILURE|ERROR" "$f"; then
              msg=$(grep -E "<<< (FAILURE|ERROR)|Caused by|Exception:|expected|Expecting" "$f" | head -8 | tr '\n' ' ' | cut -c1-900)
              echo "::error title=$(basename "$f" .txt)::$msg"
            fi
          done
          # Causa raiz: as ultimas linhas "Caused by" (as mais internas) de cada relatorio.
          for f in target/failsafe-reports/*.txt target/surefire-reports/*.txt; do
            cause=$(grep -E "^Caused by" "$f" | tail -3 | tr '\n' ' ' | cut -c1-1200)
            [ -n "$cause" ] && echo "::error title=causa $(basename "$f" .txt)::$cause"
          done
          if [ ! -d target/failsafe-reports ] && [ ! -d target/surefire-reports ]; then
            echo "::error title=build::Falhou antes dos testes (compilacao?). Veja o passo anterior."
          fi
          true

      - name: Relatórios dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
          if-no-files-found: ignore
