name: Backend · testes de integração

# Roda a suíte completa (Testcontainers sobe um MySQL 8 real) a cada push e pull request
# que mexa no backend. O build da imagem do Render pula os testes; este job é quem garante
# que migrations, mapeamentos (ddl-auto=validate) e regras de negócio continuam corretos.
on:
  push:
    branches: [main, feat/migracao-angular]
    paths: ['backend/**', '.github/workflows/backend-tests.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-tests.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Testes (unitários + integração)
        run: mvn -B verify -DtrimStackTrace=false

      # Resume as falhas como anotacoes (aparecem no resumo do job, sem abrir o log inteiro).
      - name: Resumo das falhas
        if: failure()
        run: |
          shopt -s nullglob
          # O GitHub mostra no maximo 10 anotacoes de erro por passo: primeiro as causas
          # raiz distintas (ultimas linhas "Caused by"), depois as falhas de assercao.
          files=(target/failsafe-reports/*.txt target/surefire-reports/*.txt)
          for f in "${files[@]}"; do grep -E "^Caused by" "$f" | tail -2 | tr '\n' ' '; echo; done \
            | grep -v '^\s*$' | sort -u | head -4 | while read -r cause; do
              echo "::error title=causa::$(echo "$cause" | cut -c1-1500)"
            done
          for f in "${files[@]}"; do
            grep -hE "AssertionFailedError|expected:|Expecting" "$f" | head -1 | sed "s|^|$(basename "$f" .txt): |"
          done | grep -v '^\s*$' | head -5 | while read -r fail; do
            echo "::error title=assercao::$(echo "$fail" | cut -c1-800)"
          done
          if [ ! -d target/failsafe-reports ] && [ ! -d target/surefire-reports ]; then
            echo "::error title=build::Falhou antes dos testes (compilacao?). Veja o passo anterior."
          fi
          true

      - name: Relatórios dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
          if-no-files-found: ignore
