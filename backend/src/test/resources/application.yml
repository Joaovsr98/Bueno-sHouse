spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed

app:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    secret: test-secret-key-not-for-production-use-only-testing-purposes
    expiration-minutes: 480
  # Os testes de integracao nao dependem do ViaCEP (internet); a regra tem teste unitario proprio.
  cep-check:
    enabled: false
