# Blueprint do Render: backend Spring Boot (Docker). O banco MySQL fica fora do
# Render (Aiven); os dados de conexao sao preenchidos no painel (sync: false).
services:
  - type: web
    name: bueno-s-house-api
    runtime: docker
    plan: free
    branch: feat/migracao-angular
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    # So redeploya quando o backend muda: push so de frontend/docs nao derruba a API.
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MINUTES
        value: "480"
      # dev = aplica o seed de demonstracao (usuarios @demo.local do login rapido).
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      # O Flyway e dono do schema; o Hibernate so confere se as entidades batem com ele
      # (validado no CI com MySQL real). Nunca usar update/create aqui.
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: validate
      - key: CORS_ALLOWED_ORIGINS
        value: https://bueno-s-house.vercel.app
